<!DOCTYPE html>

<style>
:root{--bg:#10151a;--pn:#182129;--ln:#2a3742;--tx:#e6e1d2;--mu:#8d9aa3;--am:#d9a441;--rd:#c8433a;--gr:#6fa36a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 2rem/1.1 Georgia,serif;margin:8px 0 4px;letter-spacing:.5px}
h1 small{display:block;font:italic 400 1rem Georgia,serif;color:var(--am);margin-top:6px}
.lead{color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button,input{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:10px 14px}
button{cursor:pointer;text-align:left}
button:hover{border-color:var(--am)}
button:focus-visible,input:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.chip{min-width:48px;text-align:center}.chip.on{background:var(--am);color:#10151a;border-color:var(--am);font-weight:700}
input{width:100%;margin:5px 0}
.go{background:var(--rd);border-color:var(--rd);font-weight:700;margin-top:12px}
.bar{display:flex;justify-content:space-between;color:var(--mu);font-size:.85rem;margin-bottom:10px}
.party{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.pc{background:var(--pn);border-left:4px solid var(--gr);padding:8px 10px;border-radius:4px}
.pc.h1{border-color:var(--am)}.pc.h2{border-color:var(--rd)}.pc.h3{border-color:#444;opacity:.55}
.pc b{display:block}.pc span{font-size:.8rem;color:var(--mu)}
.pips{display:flex;gap:4px;margin-top:5px}.pips i{width:22px;height:5px;background:var(--ln);border-radius:2px}
.pips i.f{background:var(--rd)}
.story{font:1.08rem/1.7 Georgia,serif;background:var(--pn);padding:18px;border-radius:6px;border:1px solid var(--ln)}
.tag{display:inline-block;font:700 .75rem system-ui;padding:2px 8px;border-radius:3px;margin-bottom:8px;color:#10151a}
.t-ok{background:var(--gr)}.t-ko{background:var(--am)}.t-dead{background:var(--rd);color:#fff}
.cnt{font-size:.75rem;color:var(--mu);text-align:right;margin-top:6px;font-family:system-ui}
.q{margin:18px 0 8px;font-weight:700;color:var(--am)}
.opts{display:grid;gap:8px}
.inv{margin-top:22px;border-top:1px solid var(--ln);padding-top:12px}
.inv h3{margin:0 0 6px;font-size:.95rem;color:var(--mu)}
.inv p{margin:2px 0}.it{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.it button{padding:4px 10px}

html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;-webkit-tap-highlight-color:transparent}
main{padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
h1{font-size:clamp(1.6rem,8vw,2rem)}
button,input{min-height:46px;touch-action:manipulation}
input{font-size:16px}
.chips{display:grid;grid-template-columns:repeat(4,1fr)}
#names{display:grid;grid-template-columns:1fr;gap:0 8px}
.story{padding:14px;font-size:1rem}
.opts button{padding:14px}
.party{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pc{min-width:0;min-height:0;padding:6px 6px 6px 8px;text-align:left}
.pc b{font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc span{font-size:.66rem;line-height:1.2;display:block}
.pc.cur{box-shadow:0 0 0 2px var(--am)}.pc.sel{background:#243440}
.pips i{flex:1;width:auto;height:4px}
.wp{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--ln);padding:4px 0}
.it{justify-content:space-between;flex-wrap:nowrap;border-bottom:1px solid var(--ln);padding:2px 0}
.it button{padding:8px 14px;min-height:40px}
.inv .row button{flex:1 1 40%;text-align:center}
.alt{border-style:dashed}
.hint{font-size:.78rem;color:var(--mu)}
@media(min-width:560px){#names{grid-template-columns:1fr 1fr}.chips{display:flex}}
.ai,.aiw{margin-top:10px;font-size:.85rem;font-style:italic;color:var(--mu)}
#aiM{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;width:100%}
</style></head><body><main id="app"></main>

const LOC=[["Le strade di Raccoon City sono avvolte dalla nebbia e dalle auto in fiamme.","Un semaforo lampeggia su un incrocio pieno di relitti e sangue secco.","Un autobus ribaltato blocca la via, con i finestrini coperti di mani insanguinate.","Cartelli di evacuazione sventolano tra i cadaveri sull'asfalto.","Un vicolo stretto puzza di rifiuti e di carne in decomposizione.","La fontana della piazza è tinta di rosso, e le sirene suonano a vuoto.","Un negozio di armi saccheggiato ha la serranda mezza sollevata.","Il fumo di un incendio lontano copre le stelle sopra i tetti."],["L'atrio della stazione di polizia è buio, con le luci d'emergenza che lampeggiano sui muri sporchi di sangue.","Nella stazione di polizia le scrivanie sono rovesciate e le radio gracchiano nel vuoto.","Nell'archivio della polizia gli schedari sono aperti e i fogli svolazzano nell'aria.","Le celle della stazione sono spalancate, e le sbarre portano segni di artigli.","Nella sala armi della stazione mancano quasi tutti i fucili dalle rastrelliere.","Un corridoio della stazione è coperto di bossoli e di cartucce vuote.","Sul tetto della stazione un faro ruota lento e illumina il cortile pieno di ombre.","L'ufficio del comandante è sottosopra, con una mappa della città macchiata di sangue."],["Le fogne gocciolano di liquami e di qualcosa di più denso.","Una passerella scivolosa attraversa un canale d'acqua nera, nelle fogne.","Un tunnel delle fogne è invaso da una nebbiolina verdastra e dolciastra.","Le pareti delle fogne pulsano di muffa fosforescente.","Una grata arrugginita scricchiola sopra un pozzo senza fondo.","Nelle fogne l'eco dei passi torna indietro, come se qualcuno vi seguisse.","Un vecchio impianto idraulico sibila e sputa vapore bollente dalle condotte.","Tra i condotti scorre una schiuma bianca, di chiara origine chimica."],["I corridoi dell'ospedale sono pieni di barelle abbandonate e di macchie scure.","In ospedale una flebo dondola ancora da un'asta, e nessuno risponde ai vostri richiami.","La sala operatoria ha ancora le luci accese sul tavolo, vuoto e macchiato.","L'obitorio è aperto: diversi cassetti sono stati forzati dall'interno.","Nel reparto pediatrico giocattoli sparsi e disegni sui muri raccontano un'evacuazione frettolosa.","L'ascensore dell'ospedale è bloccato tra due piani, con un ronzio sinistro.","La farmacia dell'ospedale è a soqquadro, con fiale rotte sul pavimento.","Un altoparlante ripete un avviso di quarantena, sempre più distorto."],["Il laboratorio Umbrella è un labirinto di vetro e acciaio, con un allarme che pulsa in rosso.","Dietro le teche rotte del laboratorio Umbrella restano sagome immobili e provette frantumate.","Nel laboratorio una porta blindata si apre e si richiude a intermittenza.","Una sala di contenimento del laboratorio ha il vetro crepato da un colpo enorme.","Monitor lampeggianti mostrano cifre incomprensibili e un conto alla rovescia.","Il freddo di una cella frigorifera del laboratorio avvolge il gruppo in una nube bianca.","Un corridoio del laboratorio è tappezzato di badge insanguinati e camici strappati.","Un ascensore di servizio del laboratorio scende lentamente verso livelli sotterranei."],["La stazione ferroviaria è la via di fuga: un treno merci attende sul binario 3.","Sulla banchina il treno merci fischia piano, ma l'oscurità tra voi e la locomotiva si muove.","Sotto la tettoia della stazione i tabelloni degli orari lampeggiano senza senso.","Vagoni deragliati ingombrano i binari, e il metallo geme sotto il vento.","Nella sala d'attesa restano valigie aperte e scarpe abbandonate.","Una leva di scambio arrugginita separa il vostro binario da quello della salvezza.","Il fischio del treno copre per un attimo i lamenti dei morti sulla banchina.","Dal ponte pedonale si scorgono le luci della locomotiva, ancora accesa."]];

const TH=[{w:"lo zombi",t:["Un gemito nel buio: {n} scorge un branco di zombi che barcolla verso il gruppo.","Uno zombi si stacca dal muro e si trascina verso {n}, le mandibole che scattano.","Una mano marcia afferra la caviglia di {n} da sotto un cumulo di macerie.","Degli zombi avanzano lenti in fila, e uno di loro è già a un passo da {n}."]},{w:"i cani infetti",t:["Un ringhio basso. Dei cani infetti, con la pelle scorticata, scattano verso {n}.","Zampe sul pavimento: un branco di cani infetti circonda {n}.","Un cane infetto sfonda una finestra e piomba su {n}.","Latrati rabbiosi: dei cani infetti tagliano la strada a {n}."]},{w:"il Licker",t:["Dal soffitto pende una lunga lingua: {n} si blocca mentre un Licker fiuta l'aria.","Un Licker, cieco ma letale, striscia sulla parete sopra {n}.","Un tonfo viscido: un Licker atterra alle spalle di {n}.","Artigli e una lingua: un Licker scatta verso {n} senza un suono."]},{w:"l'Hunter",t:["Artigli sul metallo. Un Hunter balza davanti a {n}, gli occhi gialli fissi sul gruppo.","Un Hunter cala dall'alto e atterra a un passo da {n}.","Un sibilo rettile: un Hunter emerge dal buio e punta {n}.","Un Hunter salta tra le macerie e si lancia contro {n}."]},{w:"i corvi infetti",t:["Uno stormo di corvi infetti si alza gracchiando e punta {n}.","Ali nere e occhi rossi: dei corvi infetti piombano su {n}.","Dei corvi infetti irrompono da una finestra rotta e assalgono {n}.","Un gracchiare assordante: i corvi infetti scendono in picchiata su {n}."]},{w:"i ragni giganti",t:["Dal buio scendono ragni giganti, e uno sfiora il volto di {n}.","Una ragnatela si muove: dei ragni giganti strisciano verso {n}.","Un ragno gigante cala dal soffitto sul suo filo, proprio davanti a {n}.","Zampe pelose sul muro: dei ragni giganti accerchiano {n}."]},{w:"lo zombi corazzato",t:["Un agente zombificato con giubbotto antiproiettile avanza verso {n}, impassibile.","Un ex militare infetto, ancora in armatura, sbarra la strada a {n}.","Uno zombi corazzato sfonda una porta e si getta su {n}.","Passi metallici: uno zombi corazzato avanza lento verso {n}."]},{w:"la pianta carnivora",t:["Radici e viticci si muovono: una pianta carnivora mutante si protende verso {n}.","Un odore dolciastro precede una pianta carnivora, che scatta verso {n}.","Tentacoli vegetali sbucano dal pavimento e afferrano {n}.","Una pianta carnivora gigante apre i suoi petali sopra {n}."]},{w:"i serpenti giganti",t:["Un sibilo secco: dei serpenti giganti si avvolgono attorno a {n}.","Un serpente gigante cala da un condotto e punta {n}.","Dei serpenti giganti sbucano dalle crepe e circondano {n}.","Un enorme serpente striscia nel buio verso {n}."]},{w:"le sanguisughe mutanti",t:["Delle sanguisughe mutanti si staccano dal soffitto e piovono su {n}.","Un tappeto di sanguisughe mutanti si muove sul pavimento verso {n}.","Una sanguisuga mutante grande come un cane si avventa su {n}.","Un risucchio viscido: delle sanguisughe mutanti assalgono {n}."]},{w:"gli zombi striscianti",t:["Degli zombi striscianti emergono dalle macerie e afferrano {n}.","Zombi senza gambe si trascinano a terra verso {n}.","Una mano scheletrica spunta dal pavimento e afferra {n}.","Gli zombi striscianti ammorbano l'aria e si avvicinano a {n}."]},{w:"il Chimera",t:["Un ronzio metallico: il Chimera, insetto mutante, scende dal soffitto su {n}.","Il Chimera, un ibrido di insetto e carne umana, si lancia su {n}.","Un artiglio affilato dal buio: il Chimera punta {n}.","Il Chimera spicca il volo e piomba su {n}."]},{w:"i pipistrelli infetti",t:["Uno stormo di pipistrelli infetti si stacca dal soffitto e assale {n}.","Un frullare di ali: dei pipistrelli infetti piombano su {n}.","Dei pipistrelli infetti escono da un condotto e puntano {n}.","Un ultrasuono assordante: i pipistrelli infetti circondano {n}."]},{w:"l'infermiere zombi",t:["Un infermiere zombi barcolla con una siringa in mano verso {n}.","Un infermiere zombi spinge una barella contro {n}.","Un infermiere zombi esce da uno sgabuzzino const VAR=OP.length*LOC[0].length*(TH.length*4*TW.length*(cb(6,2)+cb(6,3)+cb(6,4))+QT[0].length*QTW.length*4);

function start(n){

const CT={di:["dello","del","dei","dell'","della","delle","degli"],da:["dallo","dal","dai","dall'","dalla","dalle","dagli"],a:["allo","al","ai","all'","alla","alle","agli"],su:["sullo","sul","sui","sull'","sulla","sulle","sugli"]},AR=["lo ","il ","i ","l'","la ","le ","gli "];

function evpick(i){
